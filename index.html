<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Skywind — 737 Flight Simulator</title>
<style>
  :root {
    --ink: #dfe9f2;
    --dim: #8fa3b5;
    --acc: #56d2ff;
    --panel: rgba(9, 14, 21, 0.72);
    --line: rgba(120, 165, 200, 0.26);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070b; color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  /* A canvas is a replaced element: `inset: 0` alone leaves it at its intrinsic
     attribute size, which is the render resolution. It must be stretched
     explicitly or a reduced render scale shrinks the visible picture too. */
  #view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }
  #pfd { left: 18px; bottom: 16px; }
  #map { right: 18px; bottom: 16px; }
  #ndWrap { right: 18px; bottom: 16px; display: none; }
  #pfd canvas, #map canvas, #ndWrap canvas { display: block; filter: drop-shadow(0 6px 22px rgba(0,0,0,0.55)); }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 12;
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: linear-gradient(180deg, rgba(5,9,14,0.80), rgba(5,9,14,0));
    font-size: 12.5px; letter-spacing: 0.3px; pointer-events: none;
  }
  #topbar b { color: var(--acc); font-weight: 600; letter-spacing: 1.2px; }
  #topbar .sep { color: rgba(140,170,190,0.35); }
  #status { color: var(--dim); }

  #panel {
    position: fixed; top: 46px; right: 18px; width: 268px; z-index: 12;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px 14px; backdrop-filter: blur(9px);
    font-size: 12px; box-shadow: 0 12px 34px rgba(0,0,0,0.45);
  }
  #panel h3 {
    margin: 0 0 9px; font-size: 10.5px; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--acc); font-weight: 600;
  }
  #panel h3:not(:first-child) { margin-top: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  .row label { color: var(--dim); flex: 0 0 auto; }
  .row .val { color: var(--ink); font-family: Consolas, monospace; font-size: 11.5px; min-width: 46px; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 128px; height: 3px; background: rgba(140,180,210,0.28); border-radius: 3px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--acc); cursor: pointer; box-shadow: 0 0 8px rgba(86,210,255,0.7); }
  select, input[type=number] {
    background: rgba(20,30,40,0.9); color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; font-size: 11.5px; font-family: inherit; outline: none;
  }
  input[type=number] { width: 66px; font-family: Consolas, monospace; }
  .btn {
    display: block; width: 100%; margin-top: 7px; padding: 6px 8px; cursor: pointer;
    background: rgba(30,48,64,0.85); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(46,78,102,0.95); border-color: var(--acc); }
  .chip {
    padding: 3px 9px; border-radius: 20px; font-size: 10.5px; letter-spacing: 0.6px;
    border: 1px solid var(--line); color: var(--dim); cursor: pointer; background: rgba(20,30,40,0.6);
  }
  .chip.on { color: #0a1016; background: var(--acc); border-color: var(--acc); font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .check { display: flex; align-items: center; gap: 7px; margin: 5px 0; color: var(--dim); cursor: pointer; }
  .check input { accent-color: var(--acc); }

  #help {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(4, 7, 11, 0.86); backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
  }
  #help.show { display: flex; }
  #helpInner {
    width: min(760px, 92vw); max-height: 86vh; overflow: auto;
    border: 1px solid var(--line); border-radius: 12px; padding: 26px 30px;
    background: rgba(9,14,21,0.94);
  }
  #helpInner h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: 1px; }
  #helpInner p.sub { margin: 0 0 18px; color: var(--dim); font-size: 12.5px; }
  #helpInner table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #helpInner td { padding: 5px 8px; border-bottom: 1px solid rgba(120,165,200,0.10); }
  #helpInner td:nth-child(1) { color: var(--dim); width: 30%; }
  #helpInner td:nth-child(2) { font-family: Consolas, monospace; color: var(--acc); width: 34%; }
  #helpInner td:nth-child(3) { color: rgba(160,185,205,0.7); font-size: 11.5px; }
  #helpInner .close { margin-top: 18px; }

  #toast {
    position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
    background: rgba(9,14,21,0.9); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 16px; font-size: 12.5px; z-index: 20; opacity: 0;
    transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 40%, #10243c, #05070b 70%);
    transition: opacity .7s; font-size: 13px; letter-spacing: 2px;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .title { font-size: 30px; letter-spacing: 9px; font-weight: 200; color: #cfe8fb; }
  #loading .bar { width: 240px; height: 2px; background: rgba(120,165,200,0.2); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 34%; background: var(--acc); animation: sweep 1.1s infinite ease-in-out; }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(360%); } }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    box-shadow: inset 0 0 220px rgba(0,0,0,0.55);
  }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 9; background: #eaf2ff; opacity: 0; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div id="topbar">
  <b>SKYWIND 737</b>
  <span class="sep">|</span>
  <span id="status">initialising…</span>
</div>

<div class="hud" id="pfd"><canvas id="pfdCanvas"></canvas></div>
<div class="hud" id="map"><canvas id="mapCanvas"></canvas></div>
<div class="hud" id="ndWrap"><canvas id="ndCanvas"></canvas></div>

<div id="panel">
  <h3>Environment</h3>
  <div class="row"><label>Time</label><input id="timeSlider" type="range" min="0" max="24" step="0.02" value="7.6"><span class="val" id="timeVal">07:36</span></div>
  <div class="row"><label>Time rate</label><input id="rateSlider" type="range" min="0" max="600" step="1" value="30"><span class="val" id="rateVal">30×</span></div>
  <div class="row"><label>Weather</label>
    <select id="weatherSel">
      <option value="clear">Clear</option>
      <option value="fair" selected>Fair / cumulus</option>
      <option value="overcast">Overcast</option>
      <option value="rain">Rain</option>
      <option value="storm">Thunderstorm</option>
      <option value="snow">Snow</option>
    </select>
  </div>

  <h3>Autopilot</h3>
  <div class="chips">
    <span class="chip" id="apMaster">A/P</span>
    <span class="chip" id="apHdg">HDG</span>
    <span class="chip" id="apAlt">ALT</span>
    <span class="chip" id="apSpd">SPD</span>
  </div>
  <div class="row"><label>Heading</label><input id="apHdgVal" type="number" min="0" max="359" step="1" value="0"></div>
  <div class="row"><label>Altitude ft</label><input id="apAltVal" type="number" min="0" max="41000" step="500" value="10000"></div>
  <div class="row"><label>Speed kt</label><input id="apSpdVal" type="number" min="120" max="350" step="5" value="280"></div>

  <h3>View &amp; quality</h3>
  <div class="chips" id="camChips">
    <span class="chip on" data-cam="0">Cockpit</span>
    <span class="chip" data-cam="1">Chase</span>
    <span class="chip" data-cam="2">Wing</span>
    <span class="chip" data-cam="3">Orbit</span>
  </div>
  <div class="row"><label>Graphics</label>
    <select id="qualitySel">
      <option value="auto" selected>Auto</option>
      <option value="3">High</option>
      <option value="2">Medium</option>
      <option value="1">Low</option>
      <option value="0">Minimum</option>
    </select>
  </div>
  <div class="row"><label>Running at</label><span class="val" id="qualityNow" style="min-width:96px">—</span></div>
  <label class="check"><input type="checkbox" id="optVeg" checked> Grass &amp; trees</label>
  <label class="check"><input type="checkbox" id="optBloom" checked> Bloom &amp; glare</label>
  <label class="check"><input type="checkbox" id="optInvert"> Invert pitch axis</label>

  <button class="btn" id="btnRunway">Reposition on runway (Enter)</button>
  <button class="btn" id="btnApproach">Reposition on approach (Backspace)</button>
  <button class="btn" id="btnHelp">Controls (H)</button>
</div>

<div id="toast"></div>

<div id="help">
  <div id="helpInner">
    <h2>Skywind 737 — flight controls</h2>
    <p class="sub">Yoke convention: pull back (↓ / S) to raise the nose. Everything is modelled in SI units with an ISA atmosphere.</p>
    <table id="helpTable"></table>
    <button class="btn close" id="helpClose">Close</button>
  </div>
</div>

<div id="loading">
  <div class="title">SKYWIND</div>
  <div class="bar"><i></i></div>
  <div id="loadMsg">building the world…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
